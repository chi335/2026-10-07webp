<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>큰 자리수와 낮은자리수 같은지 비교</title>
</head>
<body>
<h3>큰 자리수와 낮은자리수 같은지 비교</h3>
<hr>
<script>
    let str = prompt("숫자 입력");
    let n = parseInt(str);

    if (isNaN(n)) {
        document.write("숫자가 아닙니다.");
    } else {
        // 1. 제일 낮은 자리 수 구하기 (% 10 연산)
        let low = n % 10;

        // 2. while문을 통해 제일 큰 자리 수 구하기
        let most = n;
        while (most >= 10) {
            most = Math.floor(most / 10);
        }

        // 3. 제일 큰 자리 수와 제일 낮은 자리 수 비교
        if (most === low) {
            document.write(str + ": 같음");  // 문제 지문에 따라 "성공" 대신 "같음"으로도 출력 가능
        } else {
            document.write(str + ": 다름");
        }
    }
</script>
</body>
</html>
