<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>document.write()로 표만들기</title>
</head>
<body>
<h3>document.write()로 표만들기</h3>
<hr>
<script>
    document.write("<table border='1'>");
    
    // 첫 번째 행: n 값 (0 ~ 9)
    document.write("<tr>");
    document.write("<th>n</th>");
    for (let i = 0; i <= 9; i++) {
        document.write("<td>" + i + "</td>");
    }
    document.write("</tr>");

    // 두 번째 행: n^2 값
    document.write("<tr>");
    document.write("<th>n<sup>2</sup></th>");
    for (let i = 0; i <= 9; i++) {
        document.write("<td>" + (i * i) + "</td>");
    }
    document.write("</tr>");

    document.write("</table>");
</script>
</body>
</html>
