<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>2</title>
<script>
    // pr 함수 작성
    function pr(sign, count) {
        for (let i = 0; i < count; i++) {
            document.write(sign);
        }
    }
</script>
</head>
<body>
<script>
    pr("%", 5);
</script>
</body>
</html>
