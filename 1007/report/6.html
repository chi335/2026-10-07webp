<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>do-while과 break</title>
</head>
<body>
<h3>암호를 입력하라!</h3>
<hr>
<script>
    let password;
    
    // 암호가 "you"가 아닌 동안 계속 prompt 창을 띄움
    do {
        password = prompt("암호를 대라");
    } while (password !== "you");

    // 올바른 암호가 입력되었을 때 출력
    document.write("통과!");
</script>
</body>
</html>
