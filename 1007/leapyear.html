<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>윤년 판별 프로그램</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
        }
        input, button {
            padding: 8px;
            font-size: 16px;
        }
        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

    <h3>윤년 판별기</h3>
    <hr>
    <p>판별하고 싶은 년도를 입력하세요.</p>
    
    <input type="number" id="yearInput" placeholder="예: 2026">
    <button onclick="checkLeapYear()">판별하기</button>
    
    <div id="result"></div>

    <script>
        function checkLeapYear() {
            // 입력된 값을 숫자로 가져옴
            const year = parseInt(document.getElementById('yearInput').value);
            const resultDiv = document.getElementById('result');

            // 입력값이 비어있거나 숫자가 아닐 때 처리
            if (isNaN(year)) {
                resultDiv.innerText = "올바른 년도를 입력해주세요!";
                resultDiv.style.color = "red";
                return;
            }

            // 윤년 판별 조건
            // 1. 4로 나누어 떨어지고, 100으로 나누어 떨어지지 않거나
            // 2. 400으로 나누어 떨어지는 해
            const isLeap = (year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0);

            if (isLeap) {
                resultDiv.innerText = year + "년은 윤년입니다! (2월이 29일까지 있습니다.)";
                resultDiv.style.color = "blue";
            } else {
                resultDiv.innerText = year + "년은 평년입니다. (2월이 28일까지 있습니다.)";
                resultDiv.style.color = "black";
            }
        }
    </script>

</body>
</html>
